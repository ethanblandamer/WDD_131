<!DOCTYPE html>
<html lang="en">
<head>
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipes">
    <meta property="og:description" content="A Recipe Book">
    <meta property="og:url" content="https://ethanblandamer.github.io/WDD_131/w_09/recipes.html">
    <meta property="og:image" content="images/apple-crisp.jpg">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Recipes">
    <meta name="twitter:description" content="A Recipe Book">
    <meta name="twitter:image" content="images/recipe-book.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="images/recipe-book.png">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link rel="stylesheet" href="recipes.css">
</head>
<body>
    <header>
        <h1 class="amatic-sc-regular">
            <img src="images/recipe-book.png" alt="Recipe Book logo">
            Recipe Book
        </h1>
        <form class="search-bar">
            <input type="search" placeholder="Find a recipe" aria-label="Search recipes">
            <button type="submit" aria-label="Search"><img src="images/search.svg" alt="search button"></button>
        </form>
    </header>
    <main>
        <div class="recipe-book">
            <section class="recipe-card">
                <div class="recipe-card-image">
                    <img src="images/apple-crisp.jpg" alt="apple crisp">
                </div>
                <div class="recipe-details">
                    <h3 class="recipe-category">dessert</h3>
                    <h2>Apple Crisp</h2>
                    <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                        <span aria-hidden="true">⭐</span>
                        <span aria-hidden="true">⭐</span>
                        <span aria-hidden="true">⭐</span>
                        <span aria-hidden="true">⭐</span>
                        <span aria-hidden="true">☆</span>
                    </span>
                    <div class="recipe-card-content">
                        <p>
                            This apple crisp recipe is a simple yet delicious fall dessert that's great served with warm vanilla ice cream.
                        </p>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#" ><img class="socials" src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#" ><img class="socials" src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img class="socials" src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>                  
     
    </footer>           
</body>
</html>
