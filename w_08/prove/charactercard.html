<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <link rel="stylesheet" href="charactercard.css">
    <script src="charactercard.js" defer></script>
</head>
<body>
    <main class="card">
        <img class="image" src="snortleblat.webp" alt="Snortleblat, a swamp beast">
        <h1 class="name">Snortleblat</h1>
        <section class="stats">
            <p><strong>Class:</strong> Swamp Beast Diplomat</p>
            <p><strong>Level:</strong> <span id="level">5</span></p>
            <p><strong>Health:</strong> <span id="health">100</span></p>
        </section>
        <div class="buttons">
            <button id="attacked" type="button">Attacked</button>
            <button id="levelUp" type="button">Level Up</button>
        </div>
    </main>
</body>
</html>
