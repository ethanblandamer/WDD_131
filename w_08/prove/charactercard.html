<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Snortleblat Character Card">
    <meta property="og:description" content="View Snortleblat's class, level, and health.">
    <meta property="og:url" content="https://ethanblandamer.github.io/WDD_131/w_08/prove/charactercard.html">
    <meta property="og:image" content="https://ethanblandamer.github.io/WDD_131/w_08/prove/snortleblat.webp">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Snortleblat Character Card">
    <meta name="twitter:description" content="View Snortleblat's class, level, and health.">
    <meta name="twitter:image" content="https://ethanblandamer.github.io/WDD_131/w_08/prove/snortleblat.webp">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <title>Character Card</title>
    <link rel="stylesheet" href="charactercard.css">
    <script src="charactercard.js" defer></script>
</head>
<body>
    <main class="card">
        <img class="image" src="snortleblat.webp" alt="Snortleblat, a swamp beast">
        <h1 class="name">Snortleblat</h1>
        <section class="stats">
            <p><strong>Class:</strong> Swamp Beast Diplomat</p>
            <p><strong>Level:</strong> <span id="level">5</span></p>
            <p><strong>Health:</strong> <span id="health">100</span></p>
        </section>
        <div class="buttons">
            <button id="attacked" type="button">Attacked</button>
            <button id="levelUp" type="button">Level Up</button>
        </div>
    </main>
</body>
</html>
